name: Build Website

on:
  # The API reference and the online samples are built from the library and sample code, so any
  # code change on main must republish the site. Only skip files that never end up on it.
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'plans/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
  # The Uno sample is only AOT compiled (about 25 minutes extra) in the nightly run and, by default, in
  # a manual run. Pushes deploy right away with the interpreted Uno sample; the next nightly or manual
  # run puts the AOT version back.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      aot:
        description: 'AOT compile the Uno sample (about 25 minutes extra, much faster map rendering)'
        type: boolean
        default: true
  # Pull requests keep a path filter. The Build workflow already compiles library and sample changes;
  # this one checks the website itself and the web sample projects it publishes.
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'Samples/Mapsui.Samples.Blazor/**'
      - 'Samples/Mapsui.Samples.UnoPlatform/**'
      - 'Scripts/BuildDocumentationWebSite.ps1'
      - 'Scripts/BuildSamplesWebsite.ps1'
      - 'Scripts/AddFrozenV4Website.ps1'
      - '.github/pages-v4-snapshot.*'
      - '.github/workflows/dotnet-docs.yml'
permissions:
  contents: read

# AOT runs get their own group, so a push during a long AOT build doesn't cancel it.
concurrency:
  group: mapsui-pages-${{ github.ref }}-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.aot)) && 'aot' || 'quick' }}
  cancel-in-progress: true

jobs:
  build-website:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
      UNO_AOT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.aot) }}
    steps:
        
#Begin install mkdocs        
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
    - uses: actions/cache@v4
      with:
        key: mkdocs-material-${{ env.cache_id }}
        path: .cache
        restore-keys: |
          mkdocs-material-
    - run: |
        pip install mkdocs-material 
        pip install mkdocs-glightbox
#End install mkdocs        

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0         
        filter: tree:0 
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
         dotnet-version: |
           10.0.4xx
           8.0.x
    - name: install workloads
      run: dotnet workload install maui macos android ios maccatalyst wasm-tools wasm-tools-net9 wasm-tools-net8 
    - name: Run DocFx
      shell: pwsh
      run: ./Scripts/BuildDocumentationWebSite.ps1
      # build the Blazor and Uno samples into website/v5/
    - name: Build Blazor and Uno website samples
      shell: pwsh
      run: ./Scripts/BuildSamplesWebsite.ps1 -Aot:($env:UNO_AOT -eq 'true')
    - name: Download frozen v4 website
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $manifest = Get-Content './.github/pages-v4-snapshot.json' | ConvertFrom-Json
        $archivePath = Join-Path $env:RUNNER_TEMP $manifest.assetName
        gh release download $manifest.releaseTag `
          --repo $env:GITHUB_REPOSITORY `
          --pattern $manifest.assetName `
          --dir $env:RUNNER_TEMP
        if ($LASTEXITCODE -ne 0) {
          throw 'Could not download the frozen v4 website.'
        }
        ./Scripts/AddFrozenV4Website.ps1 `
          -ArchivePath $archivePath `
          -WebsitePath ./website `
          -ExpectedSha256 $manifest.sha256 `
          -ExpectedFileCount $manifest.fileCount
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./website

  # Push, nightly and manual runs on main deploy, as long as main's latest commit came in through a pull request.
  verify-deployment-source:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.merged-pull-request.outputs.should_deploy }}
    steps:
    - name: Require a pull request merged into main
      id: merged-pull-request
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        merged_pull_requests="$(
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length'
        )"
        if [[ "$merged_pull_requests" -gt 0 ]]; then
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "Skipping deployment because $GITHUB_SHA was not merged through a pull request into main."
        fi

  deploy-website:
    if: needs.verify-deployment-source.outputs.should_deploy == 'true'
    needs:
      - build-website
      - verify-deployment-source
    runs-on: ubuntu-latest
    # Quick and AOT builds can overlap; their deployments must not.
    concurrency:
      group: mapsui-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages artifact
      id: deployment
      uses: actions/deploy-pages@v4
