name: Validate NuGets

on:
  workflow_dispatch:

jobs:
  validateNugets:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          
        filter: tree:0
    # Cache Nugets
    - uses: actions/cache@v4
      with:
        path: |
           ~/.nuget/packages/*
           !/.nuget/packages/Mapsui*
        key: ${{ runner.os }}-nuget22-${{ hashFiles('Directory.Packages.props') }}
        restore-keys: |
            ${{ runner.os }}-nuget22-
    # .Net 9 update     
    - name: Setup .NET 9 SDK 
      uses: actions/setup-dotnet@v5
      with:
         dotnet-version: |
           9.0.305
           8.0.x
    # Java Sdk install 11
    - name: Install Open JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '11'
    - name: Setup NuGet.exe for use with actions
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: latest
    - name: install maui macos android ios maccatalyst wasm-tools wasm-tools-net8
      run: dotnet workload install maui macos android ios maccatalyst wasm-tools wasm-tools-net8
    - name: Install Uno Check
      run: dotnet tool install -g Uno.Check --version 1.32.17
    - name: Uno Check
      run: uno-check -v --ci --non-interactive --fix --skip vswin --skip androidemulator --skip androidsdk --skip psexecpolicy --dotnet 9.0.305
    - name: Restore dependencies (dotnet)
      run: dotnet restore Mapsui.slnx  
    # Release Build
    # Forks have no release tags, so `git describe --tags` yields an empty version and the pack step
    # fails with MSB4044. Fall back to a placeholder so this is runnable on a fork; upstream, where
    # the tags exist, it resolves to the real version exactly as before. This job runs on Windows,
    # so the step is PowerShell rather than the bash form used in dotnet.yml.
    - name: Determine package version
      shell: pwsh
      run: |
        $version = git describe --tags 2>$null
        if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.1-fork' }
        "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        $LASTEXITCODE = 0
    - name: Build nuget packages
      run: dotnet pack Mapsui.slnx --configuration Release /p:Version=$env:PACKAGE_VERSION -o Artifacts
    - name: Cleanup
      run: git clean -fx -d -e Artifacts
    # Change Project References to nuget package references in samples    
    - name: nuget ProjectReferences to PackageReferences
      shell: pwsh
      run: |
       ./Scripts/SamplesMapsuiNugetReferences.ps1 $env:PACKAGE_VERSION
    - name: Restore dependencies (dotnet)
      run: dotnet restore Mapsui.slnx  
    # Samples Build 
    - name: Mapsui Samples without MAUI
      run: dotnet build --no-restore --configuration Debug Mapsui.WithoutMaui.slnf
    - name: Mapsui Samples MAUI
      run: dotnet build --no-restore --configuration Debug Mapsui.Maui.slnf
    # Publishing  
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nupkg.validation
        path: Artifacts/*.nupkg
