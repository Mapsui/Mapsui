name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'plans/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'plans/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  linuxBuild:      
    runs-on: ubuntu-latest
    steps:
      # Workaround to provide additional free space.
      #   https://github.com/actions/virtual-environments/issues/2840
    - name: Clear space            
      run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: false
        dotnet: false
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0              
        filter: tree:0
    # No NuGet cache: the 10 GB repository cache limit keeps evicting it, so every run missed it and then
    # spent minutes saving a new copy. Restoring from nuget.org is faster.
    - name: Setup NuGet.exe for use with actions
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: latest
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
         dotnet-version: |
           10.0.4xx
           9.0.3xx
           8.0.x
    # Open JDK
    - name: Install Open JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
    # Android SDK Install
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
         cmdline-tools-version: '8512546'
         packages: 'platform-tools platforms;android-34'
    - name: Install workloads android wasm-tools wasm-tools-net9 wasm-tools-net8 maui-android
      run: dotnet workload install android wasm-tools wasm-tools-net9 wasm-tools-net8 maui-android
    - name: Restore dependencies
      run: dotnet restore Mapsui.Linux.slnf
    - name: Build Mapsui.Linux.slnf
      run: dotnet build --no-restore --configuration Debug Mapsui.Linux.slnf
   # Run Tests
    - name: Run Mapsui.Tests
      run: dotnet test Tests/Mapsui.Tests/bin/Debug/net9.0/Mapsui.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.Nts.Tests
      run: dotnet test Tests/Mapsui.Nts.Tests/bin/Debug/net9.0/Mapsui.Nts.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.Rendering.Skia.Tests
      run: dotnet test Tests/Mapsui.Rendering.Skia.Tests/bin/Debug/net9.0/Mapsui.Rendering.Skia.Tests.dll --blame-hang-timeout:60s
    # Release Build
    # Forks have no release tags, so `git describe --tags` yields an empty version and the pack
    # steps fail with MSB4044. Fall back to a placeholder so CI is green on forks; upstream, where
    # the tags exist, this resolves to the real version exactly as before.
    - name: Determine package version
      run: echo "PACKAGE_VERSION=$(git describe --tags 2>/dev/null || echo 0.0.1-fork)" >> $GITHUB_ENV
    - name: Build Linux packages
      run: dotnet pack /p:RestorePackages=true /p:Configuration=Release /p:Version=$PACKAGE_VERSION Mapsui.Linux.slnf --output Artifacts
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nupkg.linux
        path: Artifacts/*.nupkg
  
  macBuild:
    runs-on: macos-26
    env:
      # The Linux job already builds every Android target. Leaving them out here saves the Android
      # workload, the Android SDK setup and the Android compile. See Directory.Build.targets.
      MapsuiSkipAndroid: true
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0              
        filter: tree:0
    # No NuGet cache: see the Linux job.
    - name: Setup NuGet.exe for use with actions
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: latest
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'
    # .Net 9 update     
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
         dotnet-version: |
           10.0.4xx
           8.0.x
    - name: Set MSBuildEnableWorkloadResolver
      run: echo "MSBuildEnableWorkloadResolver=true" >> $GITHUB_ENV
    - name: install workloads maui-ios maui-maccatalyst ios maccatalyst wasm-tools
      # Workload set 10.0.401 is the last one with the iOS 26.5 packs; later sets bring iOS 27 packs, which require Xcode 27.
      # No Android: the Linux job builds every Android target, so this job leaves them out (MapsuiSkipAndroid above).
      run: dotnet workload install maui-ios maui-maccatalyst ios maccatalyst wasm-tools --version 10.0.401
    - name: Restore dependencies Mapsui.Mac
      run: dotnet restore Mapsui.Mac.slnf
    # Build        
    - name: Build Samples and Tests
      # In that workload set the net9.0-ios apps expect Xcode 26.5 and the net10.0-ios Uno sample expects Xcode 26.6,
      # and an app build fails unless Xcode matches exactly. Build all of them with Xcode 26.6 and skip that check.
      run: dotnet build --no-restore --configuration Debug Mapsui.Mac.slnf -p:ValidateXcodeVersion=false
    # Run Tests   
    - name: Run Mapsui.Tests
      run: dotnet test Tests/Mapsui.Tests/bin/Debug/net9.0/Mapsui.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.Nts.Tests
      run: dotnet test Tests/Mapsui.Nts.Tests/bin/Debug/net9.0/Mapsui.Nts.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.Rendering.Skia.Tests
      run: dotnet test Tests/Mapsui.Rendering.Skia.Tests/bin/Debug/net9.0/Mapsui.Rendering.Skia.Tests.dll --blame-hang-timeout:60s
    # Release Build
    # Forks have no release tags, so `git describe --tags` yields an empty version and the pack
    # steps fail with MSB4044. Fall back to a placeholder so CI is green on forks; upstream, where
    # the tags exist, this resolves to the real version exactly as before.
    - name: Determine package version
      run: echo "PACKAGE_VERSION=$(git describe --tags 2>/dev/null || echo 0.0.1-fork)" >> $GITHUB_ENV
    - name: Build Mapsui
      run: dotnet pack --no-restore --configuration Release Mapsui/Mapsui.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.Rendering.Skia
      run: dotnet pack --no-restore --configuration Release Mapsui.Rendering.Skia/Mapsui.Rendering.Skia.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.Tiling
      run: dotnet pack --no-restore --configuration Release Mapsui.Tiling/Mapsui.Tiling.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.Nts
      run: dotnet pack --no-restore --configuration Release Mapsui.Nts/Mapsui.Nts.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.ArcGIS
      run: dotnet pack --no-restore --configuration Release Mapsui.ArcGIS/Mapsui.ArcGIS.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.Extensions
      run: dotnet pack --no-restore --configuration Release Mapsui.Extensions/Mapsui.Extensions.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.UI.iOS
      run: dotnet pack --no-restore --configuration Release Mapsui.UI.iOS/Mapsui.UI.iOS.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.UI.Maui
      run: dotnet pack --no-restore --configuration Release Mapsui.UI.Maui/Mapsui.UI.Maui.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Build Mapsui.UI.Uno.WinUI
      run: dotnet pack --no-restore --configuration Release Mapsui.UI.Uno.WinUI/Mapsui.UI.Uno.WinUI.csproj -o Artifacts -p:PackageVersion=$PACKAGE_VERSION
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nupkg.mac
        path: Artifacts/*.nupkg

  # GitHub sometimes has no free macOS runner. The Mac job is then cancelled after waiting about 15
  # minutes, without any log, and the failure email only says it was cancelled. This job fails under a
  # name that says what happened, so the cause shows up in the failure email and the checks list.
  # It only runs when the Mac job did not succeed, and it passes when the Mac job did get a runner
  # (a real build failure, whose cause is in the Mac job's own log).
  macRunnerUnavailable:
    name: macOS runner unavailable (GitHub capacity) - re-run the failed jobs
    needs: macBuild
    if: always() && needs.macBuild.result != 'success' && needs.macBuild.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - name: Check whether the Mac job got a runner
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
          --jq '.jobs[] | select(.name == "macBuild") | {runner: (.runner_name // ""), steps: (.steps | length)}')"
        echo "Mac job: $job"
        runner="$(jq -r '.runner' <<< "$job")"
        steps="$(jq -r '.steps' <<< "$job")"
        if [[ -z "$runner" && "$steps" == "0" ]]; then
          echo "::error title=macOS runner unavailable::GitHub had no free macOS runner, so the Mac job never started. This is a GitHub capacity problem, not a build failure. Re-run the failed jobs."
          exit 1
        fi
        echo "The Mac job did get a runner, so its failure is a real build failure. See the Mac job's log."

  winBuild:
    runs-on: windows-latest
    # C: has ~26 GB free on Windows runners, less than the workloads plus the NuGet packages need; D: has ~200 GB.
    env:
      NUGET_PACKAGES: D:/nuget/packages
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: tree:0
    # No NuGet cache: see the Linux job.
    # .Net 8 update
    - name: Setup .NET 10 SDK 
      uses: actions/setup-dotnet@v5
      with:
         dotnet-version: |
           10.0.4xx
           8.0.x
    # Java Sdk install 17
    - name: Install Open JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft' # open jdk
        java-version: '17'
    - name: Setup NuGet.exe for use with actions
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: latest
    - name: install maui macos android ios maccatalyst wasm-tools wasm-tools-net9 wasm-tools-net8
      run: dotnet workload install maui macos android ios maccatalyst wasm-tools wasm-tools-net9 wasm-tools-net8
    - name: Restore dependencies (dotnet)
      run: dotnet restore Mapsui.slnx  
    - name: Run dotnet format
      run: |
        dotnet format whitespace Mapsui.slnx --verbosity normal --verify-no-changes
        dotnet format style Mapsui.slnx --verbosity normal --verify-no-changes
        # The analyzers still have errors be we are close to fixing all of them
        # dotnet format  analyzers  Mapsui.slnx --verbosity normal --verify-no-changes
    # Test Build
    - name: Mapsui.Nts.Tests
      run: dotnet build --no-restore --configuration Debug Tests/Mapsui.Nts.Tests/Mapsui.Nts.Tests.csproj
    - name: Mapsui.Rendering.Skia.Tests
      run: dotnet build --no-restore --configuration Debug Tests/Mapsui.Rendering.Skia.Tests/Mapsui.Rendering.Skia.Tests.csproj
    - name: Mapsui.Tests
      run: dotnet build --no-restore --configuration Debug Tests/Mapsui.Tests/Mapsui.Tests.csproj
    - name: Mapsui.UI.Maui.Tests
      run: dotnet build --no-restore --configuration Debug Tests/Mapsui.UI.Maui.Tests/Mapsui.UI.Maui.Tests.csproj
    # Run Tests
    - name: Run Mapsui.Tests
      run: dotnet test Tests/Mapsui.Tests/bin/Debug/net9.0/Mapsui.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.Nts.Tests
      run: dotnet test Tests/Mapsui.Nts.Tests/bin/Debug/net9.0/Mapsui.Nts.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.Rendering.Skia.Tests
      run: dotnet test Tests/Mapsui.Rendering.Skia.Tests/bin/Debug/net9.0/Mapsui.Rendering.Skia.Tests.dll --blame-hang-timeout:60s
    - name: Run Mapsui.UI.Maui.Tests
      run: dotnet test Tests/Mapsui.UI.Maui.Tests/bin/Debug/net9.0-windows10.0.19041.0/Mapsui.UI.Maui.Tests.dll --blame-hang-timeout:60s
