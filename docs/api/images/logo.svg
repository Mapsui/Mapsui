<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Mapsui logo diagonal gradient</title>
  <desc id="desc">
    A purple circle with a cubic diagonal gradient and matching top and bottom cutouts.
  </desc>
  <defs>
    <linearGradient
      id="logo-fill-gradient"
      x1="36"
      y1="36"
      x2="476"
      y2="476"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#4D84F2" />
      <stop offset="10%" stop-color="#4F79E4" />
      <stop offset="20%" stop-color="#526ED5" />
      <stop offset="30%" stop-color="#5664C5" />
      <stop offset="40%" stop-color="#595AB4" />
      <stop offset="50%" stop-color="#575094" />
      <stop offset="60%" stop-color="#4F457F" />
      <stop offset="70%" stop-color="#473C6E" />
      <stop offset="80%" stop-color="#40335F" />
      <stop offset="90%" stop-color="#392C53" />
      <stop offset="100%" stop-color="#332548" />
    </linearGradient>
  </defs>
  <!--
    One closed outline: circle arcs for the rim, straight segments for the top
    notch and the M cutout. Cutouts used to be separate shapes knocked out
    through a mask; where two of those shapes met edge to edge, antialiasing
    left a faint seam across the logo.
  -->
  <path
    fill="url(#logo-fill-gradient)"
    d="M168 54.366598 A220 220 0 0 0 168 457.633402 L168 182.18079 L256 256 L344 182.18079 L344 457.633402 A220 220 0 0 0 344 54.366598 L256 128.185808 Z"
  />
</svg>
